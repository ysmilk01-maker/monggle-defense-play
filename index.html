<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#c4baf0">
  <title>꼬마 마법사 디펜스 시험판</title>
  <link rel="icon" type="image/png" href="TemplateData/favicon.png">
  <style>
    @font-face { font-family: 'JuaSub'; src: url('TemplateData/jua-sub.ttf') format('truetype'); font-display: block; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(180deg, #b9aef0 0%, #e7c9f2 60%, #ffd9e8 100%); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #frame { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(100vw, calc(100vh * 9 / 16)); height: 100vh; overflow: hidden; box-shadow: 0 0 60px rgba(90, 50, 140, .35); background: #c4baf0; }
    @media (max-aspect-ratio: 3/4) { #frame { width: 100vw; height: 100%; box-shadow: none; } }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #c4baf0; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
               background: radial-gradient(circle at 50% 38%, #fff4fa 0%, #e9dcfb 45%, #c4baf0 100%); transition: opacity .45s ease; font-family: 'JuaSub', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    #loading.done { opacity: 0; pointer-events: none; }
    #icon { width: 34%; max-width: 168px; aspect-ratio: 1; border-radius: 24%; box-shadow: 0 10px 0 #b49be0, 0 18px 30px rgba(90, 50, 140, .35); animation: hop 1.1s ease-in-out infinite; }
    @keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 45% { transform: translateY(-18px) scale(.97, 1.03); } 55% { transform: translateY(-18px) scale(.97, 1.03); } 90% { transform: translateY(0) scale(1.05, .95); } }
    #title { font-size: clamp(30px, 9vw, 46px); color: #ff86b0; letter-spacing: 1px;
             text-shadow: 3px 3px 0 #fff, -3px 3px 0 #fff, 3px -3px 0 #fff, -3px -3px 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 3px 0 0 #fff, -3px 0 0 #fff, 0 8px 0 #8a55b8; }
    #bar { width: 66%; max-width: 330px; height: 22px; border-radius: 12px; background: #fff; box-shadow: inset 0 2px 0 rgba(0,0,0,.08), 0 4px 0 #b49be0; overflow: hidden; border: 3px solid #fff; }
    #fill { width: 0%; height: 100%; border-radius: 9px; background: linear-gradient(90deg, #ff9fc0, #ff7aa8); transition: width .2s ease; }
    #tip { font-size: clamp(16px, 4.4vw, 22px); color: #6c4a92; }
    #warn { position: absolute; left: 10px; right: 10px; top: 10px; display: none; background: #fff3; color: #4a2e5c; font: 14px sans-serif; padding: 8px; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <img id="icon" src="TemplateData/icon.png" alt="">
      <div id="title">꼬마 마법사 디펜스</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="tip">마법 탑으로 가는 중… <span id="pct">0%</span></div>
    </div>
    <div id="warn"></div>
  </div>
  <script>
    var canvas = document.querySelector('#unity-canvas');
    function unityShowBanner(msg, type) {
      var w = document.querySelector('#warn');
      if (type === 'error') { w.style.display = 'block'; w.textContent = msg; }
      else console.warn(msg);
    }
    var buildUrl = 'Build';
    var config = {
      arguments: [],
      dataUrl: buildUrl + '/49768fdb8bed6979afcdbc2037830d58.data',
      frameworkUrl: buildUrl + '/83b9930847c412dae64219284f83e16b.framework.js',
      codeUrl: buildUrl + '/231c5a61f4afe588bc23276476f407d8.wasm',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "ninetosixlab",
      productName: "몽글몽글 디펜스",
      productVersion: "0.1",
      showBanner: unityShowBanner,
    };
    // 아이폰 3배 화면은 2배로 그려 가볍게
    config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    var loading = document.querySelector('#loading');
    var fill = document.querySelector('#fill');
    var pct = document.querySelector('#pct');
    var script = document.createElement('script');
    script.src = buildUrl + '/d27e8749ce55f8945b74d5b2b244174b.loader.js';
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        var v = Math.round(p * 100);
        fill.style.width = v + '%';
        pct.textContent = v + '%';
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;
        fill.style.width = '100%'; pct.textContent = '100%';
        setTimeout(function () { loading.classList.add('done'); }, 250);
      }).catch(function (message) { unityShowBanner(String(message), 'error'); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
