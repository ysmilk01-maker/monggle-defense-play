<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#6f5bb8">
  <title>루미의 마법 디펜스 시험판</title>
  <link rel="icon" type="image/png" href="TemplateData/favicon.png">
  <style>
    @font-face { font-family: 'JuaSub'; src: url('TemplateData/jua-sub.ttf') format('truetype'); font-display: block; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2d2154; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #frame { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(100vw, calc(100vh * 9 / 16)); height: 100vh; overflow: hidden; box-shadow: 0 0 60px rgba(30, 10, 60, .5); background: #2d2154;
             padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }   /* 47.2차 — 아이폰 상태 표시줄 · 홈 바 밑에 단추가 깔리지 않게 */
    @media (max-aspect-ratio: 3/4) { #frame { width: 100vw; height: 100%; box-shadow: none; } }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #c4baf0; outline: none; }
    #loading { position: absolute; inset: 0; overflow: hidden; font-family: 'JuaSub', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; transition: opacity .55s ease;
               background: linear-gradient(180deg, #4b3a8f 0%, #8a6cc9 38%, #e7a9cf 70%, #ffd2c2 100%); }
    #loading.bgimg { background: #6f5bb8 url('TemplateData/bg.webp') center bottom / cover no-repeat; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading.done #lumiBox { transform: translate(140vw, -40px) rotate(-8deg) !important; transition: transform .7s ease-in; }
    .star { position: absolute; width: 10px; height: 10px; background: #fff7c9; clip-path: polygon(50% 0, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0 50%, 39% 38%); animation: tw 2.4s ease-in-out infinite; opacity: .2; }
    @keyframes tw { 0%, 100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.15); } }
    #titleBox { position: absolute; left: 0; right: 0; top: 17%; text-align: center; line-height: 1.02; }
    .tl { display: block; white-space: nowrap; }
    .tl span { display: inline-block; animation: wave 2.2s ease-in-out infinite; }
    #t1 { font-size: clamp(38px, 12.5vw, 64px); color: #ff86b0; }
    #t2 { font-size: clamp(48px, 16vw, 82px); color: #ffcf55; margin-top: -2px; }
    .tl span { text-shadow: 3px 3px 0 #fff, -3px 3px 0 #fff, 3px -3px 0 #fff, -3px -3px 0 #fff, 0 3.5px 0 #fff, 0 -3.5px 0 #fff, 3.5px 0 0 #fff, -3.5px 0 0 #fff, 0 9px 0 #6b3fa0, 0 14px 18px rgba(40, 10, 80, .35); }
    @keyframes wave { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-7px) rotate(3deg); } }
    #ribbon { display: inline-block; margin-top: 14px; padding: 7px 26px 9px; border-radius: 10px; background: linear-gradient(180deg, #ff9fc3, #e9608f); color: #fff; font-size: clamp(16px, 4.6vw, 23px);
              box-shadow: 0 4px 0 #a8406a, 0 8px 14px rgba(60, 10, 40, .3); text-shadow: 0 2px 0 #a8406a; border: 2px solid #ffe2ee; }
    #track { position: absolute; left: 12%; right: 12%; top: 58%; height: 26px; border-radius: 15px; background: rgba(45, 25, 90, .55); border: 3px solid #ffe08a;
             box-shadow: 0 4px 0 #b8892e, 0 8px 18px rgba(30, 10, 60, .45), inset 0 2px 6px rgba(0,0,0,.35); }
    #fill { position: absolute; left: 3px; top: 3px; bottom: 3px; width: 0; border-radius: 10px; overflow: hidden;
            background: linear-gradient(90deg, #ff8fbd, #ffb36b 60%, #ffe27a); box-shadow: 0 0 12px rgba(255, 210, 120, .8); }
    #fill::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.35) 0 10px, rgba(255,255,255,0) 10px 22px); animation: slide 0.9s linear infinite; }
    @keyframes slide { from { background-position: 0 0; } to { background-position: 44px 0; } }
    #lumiBox { position: absolute; top: calc(58% - 74px); left: 12%; width: 96px; height: 96px; margin-left: -48px; transition: left .15s linear; z-index: 3; }
    #lumi { width: 100%; height: 100%; object-fit: contain; animation: bob 1.1s ease-in-out infinite; filter: drop-shadow(0 6px 4px rgba(30, 10, 60, .35)); }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-9px) rotate(3deg); } }
    .dust { position: absolute; width: 9px; height: 9px; background: #fff3b0; clip-path: polygon(50% 0, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0 50%, 39% 38%); z-index: 2; pointer-events: none; animation: dust .9s ease-out forwards; }
    @keyframes dust { from { opacity: 1; transform: translate(0, 0) scale(1); } to { opacity: 0; transform: translate(-26px, 14px) scale(.3); } }
    #msg { position: absolute; left: 0; right: 0; top: calc(58% + 40px); text-align: center; color: #fff; font-size: clamp(17px, 4.8vw, 24px);
           text-shadow: 0 2px 0 #5a3590, 2px 0 0 #5a3590, -2px 0 0 #5a3590, 0 -2px 0 #5a3590, 0 4px 8px rgba(30, 10, 60, .5); }
    #pct { color: #ffe27a; margin-left: 6px; }
    #tip { position: absolute; left: 9%; right: 9%; top: calc(58% + 86px); min-height: 52px; padding: 12px 16px 13px 50px; border-radius: 16px; box-sizing: border-box;
           background: rgba(255, 249, 236, .94); border: 3px solid #e7c26a; box-shadow: 0 4px 0 #b8892e, 0 8px 16px rgba(30, 10, 60, .3); color: #5b3b80;
           font-size: clamp(14px, 3.9vw, 18px); line-height: 1.35; transition: opacity .35s ease; word-break: keep-all; overflow-wrap: break-word; }
    #tip::before { content: '팁'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border-radius: 50%; background: #ff86b0; color: #fff;
                   font-size: 15px; line-height: 30px; text-align: center; box-shadow: 0 2px 0 #c25080; }
    #parade { position: absolute; left: 0; right: 0; bottom: 3%; height: 70px; pointer-events: none; }
    .mon { position: absolute; bottom: 0; width: 58px; height: 58px; object-fit: contain; animation: walk 13s linear infinite, hop .5s ease-in-out infinite alternate; filter: drop-shadow(0 4px 3px rgba(30, 10, 60, .35)); }
    @keyframes walk { from { left: -70px; } to { left: calc(100% + 70px); } }
    @keyframes hop { from { margin-bottom: 0; } to { margin-bottom: 7px; } }
    #foot { position: absolute; left: 0; right: 0; bottom: calc(3% + 74px); text-align: center; color: rgba(255,255,255,.9); font-size: 13px; text-shadow: 0 1px 2px rgba(30,10,60,.7); }
    #retry { position: absolute; left: 8%; right: 8%; top: 40%; display: none; z-index: 10; text-align: center; background: rgba(255,250,253,.96); border: 4px solid #e8608c; font-family: 'JuaSub', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      border-radius: 22px; padding: 18px 16px 20px; color: #4a2e5c; font-size: clamp(16px, 4.4vw, 21px); line-height: 1.45; box-shadow: 0 6px 18px rgba(40,10,70,.35); }
    #retry button { margin-top: 14px; font: inherit; font-size: clamp(18px, 5vw, 24px); color: #fff; background: #e8608c; border: 0; border-radius: 999px; padding: 10px 34px;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.18); }
    #warn { position: absolute; left: 10px; right: 10px; top: 10px; display: none; background: #fff3; color: #4a2e5c; font: 14px sans-serif; padding: 8px; border-radius: 8px; z-index: 9; }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading" class="bgimg">
      <div id="stars"></div>
      <div id="titleBox">
        <span class="tl" id="t1">루미의 마법</span>
        <span class="tl" id="t2">디펜스</span>
        <div id="ribbon">마법 탑을 지켜라!</div>
      </div>
      <div id="track"><div id="fill"></div></div>
      <div id="lumiBox"><img id="lumi" src="TemplateData/lumi.webp" alt=""></div>
      <div id="msg"><span id="step">마법책을 펴는 중…</span><span id="pct">0%</span></div>
      <div id="tip"></div>
      <div id="foot">처음 열 때만 조금 기다려요</div>
      <div id="parade"></div>
    </div>
    <!-- 51차 — 「다시 시도」 상자는 로딩 화면 밖에 둔다(로드가 끝나 로딩 화면을 숨긴 뒤에도 멈춤 안내가 뜨게) -->
    <div id="retry"><div id="retryMsg">불러오지 못했어요.<br>인터넷을 확인하고 다시 시도해 주세요</div><button id="retryBtn" type="button">다시 시도</button></div>
    <div id="warn"></div>
  </div>
  <script>
    var TIPS = ["Lv4 마법진 둘을 옆에 두고 누르면 합체할 수 있어요", "Lv3 이 되면 진화 갈림길에서 두 길 중 하나를 골라요", "옆에 붙은 마법진끼리 서로 돕기도, 깎기도 해요. 상성표를 확인해 보세요", "대포 버섯은 마법진에 포자를 쏴요. 먼저 잡으세요", "땅굴 두더지는 길 중간에서 솟아나요. 길 뒤쪽에도 마법진을 설치하세요", "부서진 마법진은 눌러서 별사탕으로 바로 고칠 수 있어요", "필살기는 처음부터 가득! 한 판에 한 번, 몬스터가 몰려올 때 눌러요", "다음 웨이브 예고를 보고 미리 대비하세요"], STEPS = ["마법책을 펴는 중…", "마법진을 준비하는 중…", "몬스터들이 다가오는 중…", "마법 탑에 불을 켜는 중…", "준비 완료!"], MONS = ["e-jelly", "e-mush", "e-slime", "e-boar", "e-turtle"];
    var loading = document.querySelector('#loading');
    // 별 — 위치는 고정된 씨앗으로(새로 고침해도 같은 하늘)
    (function () {
      var s = 7, box = document.querySelector('#stars');
      function r() { s = (s * 9301 + 49297) % 233280; return s / 233280; }
      for (var i = 0; i < 26; i++) {
        var e = document.createElement('i'); e.className = 'star';
        var z = 6 + r() * 10;
        e.style.cssText = 'left:' + (r() * 96) + '%;top:' + (r() * 52) + '%;width:' + z + 'px;height:' + z + 'px;animation-delay:' + (-r() * 2.4) + 's;animation-duration:' + (1.8 + r() * 1.6) + 's';
        box.appendChild(e);
      }
    })();
    // 제목 — 한 글자씩 출렁
    ['#t1', '#t2'].forEach(function (id, k) {
      var el = document.querySelector(id), t = el.textContent; el.textContent = '';
      for (var i = 0; i < t.length; i++) {
        var sp = document.createElement('span'); sp.textContent = t[i] === ' ' ? ' ' : t[i];
        sp.style.animationDelay = (-(i * 0.18 + k * 0.4)) + 's'; el.appendChild(sp);
      }
    });
    // 몬스터 행렬
    (function () {
      var box = document.querySelector('#parade');
      MONS.forEach(function (m, i) {
        var e = document.createElement('img'); e.className = 'mon'; e.src = 'TemplateData/' + m + '.webp';
        e.style.animationDelay = (-(i * 2.6)) + 's, ' + (-(i * 0.17)) + 's';
        box.appendChild(e);
      });
    })();
    // 팁 카드 — 3.6초마다
    (function () {
      var tip = document.querySelector('#tip'), n = Math.floor((Date.now() / 1000) % TIPS.length);
      function show() { tip.style.opacity = 0; setTimeout(function () { tip.textContent = TIPS[n % TIPS.length]; tip.style.opacity = 1; n++; }, 350); }
      tip.textContent = TIPS[n % TIPS.length]; n++;
      window.tipTimer = setInterval(show, 3600);   // 51차 — 로드가 끝나면 finish 에서 멈춘다
    })();
    // 진행 — 받은 만큼을 부드럽게 따라가고, 루미가 막대 끝을 따라 난다
    var target = 0, shown = 0, done = false;
    var fill = document.querySelector('#fill'), lumiBox = document.querySelector('#lumiBox'), track = document.querySelector('#track');
    var pctEl = document.querySelector('#pct'), stepEl = document.querySelector('#step'), dustT = 0;
    function frame(t) {
      shown += (target - shown) * 0.12; if (Math.abs(target - shown) < 0.001) shown = target;
      var v = Math.round(shown * 100);
      fill.style.width = 'calc(' + (shown * 100) + '% - ' + (6 * shown) + 'px)';
      lumiBox.style.left = 'calc(12% + ' + (shown * 76) + '%)';
      pctEl.textContent = v + '%';
      stepEl.textContent = STEPS[Math.min(STEPS.length - 1, v >= 100 ? 4 : Math.floor(v / 25))];
      if (t - dustT > 90 && !done) {
        dustT = t;
        var d = document.createElement('i'); d.className = 'dust';
        var r = lumiBox.getBoundingClientRect(), f = loading.getBoundingClientRect();
        d.style.left = (r.left - f.left + 8 + Math.random() * 10) + 'px'; d.style.top = (r.top - f.top + 54 + Math.random() * 16) + 'px';
        loading.appendChild(d); setTimeout(function () { d.remove(); }, 900);
      }
      if (!done || shown < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    var lastP = 0, lastPT = Date.now();
    function progress(p) { if (p > lastP + 0.001) { lastP = p; lastPT = Date.now(); } target = Math.max(target, Math.min(1, p)); }
    // 47차 — 불러오지 못했거나 20초 넘게 멈춰 있으면 「다시 시도」(원문 오류는 콘솔에만)
    // 51차 — live: 로드가 끝난 뒤의 멈춤(그래픽 문맥을 잃음 · wasm 중단)에도 같은 상자를 띄운다. 문구는 로딩 화면 글꼴(jua-sub)에 이미 있는 글자로만
    function showRetry(slow, live) {
      if (done && !live) return;
      var r = document.querySelector('#retry'); if (!r) return;
      document.querySelector('#retryMsg').innerHTML = live ? '게임이 멈춰 있어요.<br>다시 시도를 눌러 주세요' : slow ? '인터넷이 느려요.<br>조금 더 기다리거나 다시 시도해 주세요' : '불러오지 못했어요.<br>인터넷을 확인하고 다시 시도해 주세요';
      r.style.display = 'block';
    }
    document.addEventListener('click', function (e) { if (e.target && e.target.id === 'retryBtn') location.reload(); });
    var slowTimer = setInterval(function () { if (!done && Date.now() - lastPT > 20000) showRetry(true); }, 2000);
    // 51차 — 사라짐 연출(.55초 · .7초)이 끝난 뒤 로딩 화면을 display:none 으로 빼 무한 CSS 애니메이션을 멈추고, 팁 · 느림 검사 타이머도 멈춘다(「다시 시도」 상자는 밖에 있어 함께 숨지 않는다)
    function finish() { done = true; target = 1; setTimeout(function () { loading.classList.add('done'); setTimeout(function () { loading.style.display = 'none'; clearInterval(window.tipTimer); clearInterval(slowTimer); }, 800); }, 650); }

    var test = /[?&]loadtest(=(\d+))?/.exec(location.search);
    if (test) {
      // 화면만 보는 시험 — 유니티를 부르지 않는다
      if (test[2]) { target = shown = (+test[2]) / 100; }
      else { var tp = 0; setInterval(function () { tp = tp >= 1 ? 0 : tp + 0.02; target = tp; if (tp === 0) shown = 0; }, 120); }
    } else {
      var canvas = document.querySelector('#unity-canvas');
      function unityShowBanner(msg, type) {
        var w = document.querySelector('#warn');
        console.warn(msg);
        if (type === 'error') showRetry(false, done);   // 51차 — 로드 뒤 오류도 안내
      }
      var buildUrl = 'Build';
      var config = {
        arguments: [],
        dataUrl: buildUrl + '/2ac5ba038b39c559a2785e921312459e.data.unityweb',
        frameworkUrl: buildUrl + '/fbbaec9e8dfad53daf16ac096211e5d2.framework.js.unityweb',
        codeUrl: buildUrl + '/2b2b679fe74b967af9065d2444309c8b.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        companyName: "ninetosixlab",
        productName: "몽글몽글 디펜스",
        productVersion: "0.1",
        showBanner: unityShowBanner,
        // 51차 — 로드 뒤 실행 중 오류. 로더는 window 의 error · unhandledrejection 을 모두 이리로 넘긴다(토스 브리지 등 다른 스크립트 오류 포함).
        // 그래서 늘 true 를 돌려 유니티 기본 영어 경고창만 막고, wasm 중단 · 메모리 부족 같은 치명 오류 낱말이 있을 때만 「다시 시도」를 띄운다.
        // 'abort(' 는 유니티 abortHandler 꼴(「abort(…) at …」)이다 — 그냥 'abort' 로 찾으면 fetch 취소(AbortError 「… aborted」)에도 걸린다. 로드 중에는 로더의 startupErrorHandler 가 먼저 받는다
        errorHandler: function (msg) {
          if (!done) return false;
          console.warn(msg);
          if (/RuntimeError|abort\(|[Oo]ut of memory|unreachable|memory access out of bounds|Cannot enlarge memory/.test(String(msg))) showRetry(false, true);
          return true;
        },
      };
      // 그리기 배율 상한 3(47차 — 2 로 막으면 아이폰(3배)에서 흐릿하다). 51차 — 측정용: 주소에 ?dpr=숫자 가 있으면 그 값을 상한으로 쓴다(없거나 잘못된 값이면 3)
      var dprQ = /[?&]dpr=([\d.]+)/.exec(location.search), dprCap = dprQ ? parseFloat(dprQ[1]) : NaN;
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, dprCap > 0 ? dprCap : 3);
      var script = document.createElement('script');
      script.src = buildUrl + '/02090662a705e17dbe457416788a1ec7.loader.js';
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) { progress(p * 0.97); }).then(function (unityInstance) {
          window.unityInstance = unityInstance;
          finish();
          // 47차 — 앱 · 탭을 내리면 게임이 저장하고 멈춘다
          var hide = function () { try { unityInstance.SendMessage('Game', 'OnHidden'); } catch (e) {} };
          // 47.5차 — 돌아오면 음악을 다시 튼다(OnShown). 유니티 웹GL 은 탭이 숨어도 Web Audio 를 스스로 멈추지 않는다
          var show = function () { try { unityInstance.SendMessage('Game', 'OnShown'); } catch (e) {} };
          document.addEventListener('visibilitychange', function () { if (document.hidden) hide(); else show(); });
          window.addEventListener('pagehide', hide);
          window.addEventListener('pageshow', show);
        }).catch(function (message) { console.warn(message); showRetry(false); });
      };
      script.onerror = function () { showRetry(false); };
      canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); showRetry(false, done); });   // 51차 — 로드 뒤에 잃어도 안내
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
